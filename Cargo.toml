[workspace]

resolver = "2"

members = [
    "crates/chain-registry",
    "crates/relayer",
    "crates/relayer-cli",
    "crates/relayer-rest",
    "crates/relayer-types",
    "crates/telemetry",
]

exclude = [
    "tools/check-guide",
    "tools/integration-test",
    "tools/query-events",
    "tools/test-framework",
]

[workspace.dependencies]
ibc-chain-registry = { path = "crates/chain-registry" }
ibc-integration-test = { version = "0.32.2", path = "tools/integration-test" }
ibc-relayer          = { version = "0.32.2", path = "crates/relayer" }
# Hermes dependencies
ibc-relayer-cli      = { version = "1.13.2", path = "crates/relayer-cli" }
ibc-relayer-rest     = { version = "0.32.2", path = "crates/relayer-rest" }
ibc-relayer-types = { path = "crates/relayer-types" }
ibc-telemetry        = { version = "0.32.2", path = "crates/telemetry" }
ibc-test-framework   = { version = "0.32.2", path = "tools/test-framework" }

# IBC dependencies
ibc-proto = { version = "0.52.0" }
ics23 = { version = "0.12.0" }

tendermint = { version = "0.40.4" }
tendermint-light-client = { version = "0.40.4" }
tendermint-light-client-detector = { version = "0.40.4" }
tendermint-light-client-verifier = { version = "0.40.4" }
tendermint-proto = { version = "0.40.4" }
tendermint-rpc = { version = "0.40.4" }
tendermint-testgen = { version = "0.40.4" }

# Namada dependencies
namada_sdk = { version = "0.251.0" }

# Other dependencies
abscissa_core            = "=0.6.0"
anyhow                   = "1.0"
async-stream             = "0.3.6"
async-trait              = "0.1.83"
axum                     = "0.8"
axum-server              = "0.8"
bech32                   = "0.9.1"
bitcoin                  = "0.31.2"
bs58                     = "0.5.1"
byte-unit                = { version = "4.0.19", default-features = false }
bytes                    = "1.8.0"
clap                     = "3.2"
clap_complete            = "3.2"
color-eyre               = "0.6"
console                  = "0.15.5"
crossbeam-channel        = "0.5.12"
dashmap                  = "5.4.0"
derive_more              = { version = "0.99.18", default-features = false }
dialoguer                = "0.11.0"
digest                   = "0.10.6"
dirs-next                = "2.0.0"
ed25519                  = "2.2.2"
ed25519-dalek            = "2.0.0"
ed25519-dalek-bip32      = "0.3.0"
env_logger               = "0.11.5"
eyre                     = "0.6.12"
flex-error               = { version = "0.4.4", default-features = false }
futures                  = "0.3.27"
generic-array            = "0.14.7"
hdpath                   = "0.6.3"
hex                      = "0.4.3"
http                     = "1.0.0"
humantime                = "2.1.0"
humantime-serde          = "1.1.1"
itertools                = "0.14.0"
moka                     = "0.12.8"
num-bigint               = "0.4"
num-rational             = "0.4.1"
once_cell                = "1.20.2"
oneline-eyre             = "0.1"
opentelemetry            = "0.20.0"
opentelemetry-prometheus = "0.13.0"
opentelemetry_sdk        = { version = "0.20.0", features = ["metrics"] }
primitive-types          = { version = "0.12.1", default-features = false }
prometheus               = "0.13.4"
prost                    = "0.14.3"
rand                     = "0.8.5"
regex                    = "1.11.1"
reqwest                  = { version = "0.11.27", default-features = false }
retry                    = { version = "2.0.0", default-features = false }
ripemd                   = "0.1.3"
rpassword                = "5.0.1"
secp256k1                = "0.28.2"
semver                   = "1.0.21"
serde                    = "1.0.214"
serde_derive             = "1.0.104"
serde_json               = "1.0.132"
serde_yaml               = "0.9.34"
serial_test              = "3.2.0"
sha2                     = "0.10.6"
signal-hook              = "0.3.17"
signature                = "2.1.0"
strum                    = "0.25"
subtle-encoding          = "0.5.1"
test-log                 = "0.2.18"
thiserror                = "1.0.69"
time                     = "0.3"
tiny-bip39               = "1.0.0"
tiny-keccak              = { version = "2.0.2", default-features = false }
tokio                    = "1.39.2"
tokio-stream             = "0.1.16"
toml                     = "0.8.19"
tonic                    = "0.14.5"
tracing                  = { version = "0.1.36", default-features = false }
tracing-subscriber       = "0.3.14"
uint                     = "0.9"
uuid                     = "1.10.5"

[patch.'https://github.com/permissionlessweb/hermes']
ibc-chain-registry = { path = "crates/chain-registry" }
ibc-relayer-types = { path = "crates/relayer-types" }

[patch.crates-io]
ibc-proto = { path = "../ibc-proto-rs" }
ics23 = { path = "../ics23/rust" }
tendermint = { path = "../tendermint-rs/tendermint" }
tendermint-light-client = { path = "../tendermint-rs/light-client" }
tendermint-light-client-detector = { path = "../tendermint-rs/light-client-detector" }
tendermint-light-client-verifier = { path = "../tendermint-rs/light-client-verifier" }
tendermint-proto = { path = "../tendermint-rs/proto" }
tendermint-rpc = { path = "../tendermint-rs/rpc" }
tendermint-testgen = { path = "../tendermint-rs/testgen" }
namada_sdk = { path = "../namada/crates/sdk" }
informalsystems-pbjson-types = { path = "../pbjson/pbjson-types" }
penumbra-sdk-custody = { path = "../penumbra/crates/custody" }
penumbra-sdk-fee = { path = "../penumbra/crates/core/component/fee" }
penumbra-sdk-ibc = { path = "../penumbra/crates/core/component/ibc" }
penumbra-sdk-keys = { path = "../penumbra/crates/core/keys" }
penumbra-sdk-proto = { path = "../penumbra/crates/proto" }
penumbra-sdk-transaction = { path = "../penumbra/crates/core/transaction" }
penumbra-sdk-view = { path = "../penumbra/crates/view" }
penumbra-sdk-wallet = { path = "../penumbra/crates/wallet" }

[profile.release]
overflow-checks = true
